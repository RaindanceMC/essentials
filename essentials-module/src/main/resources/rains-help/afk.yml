id: afk
title: Away from keyboard
summary: How the server notices you stepped away, what everybody sees, and how to come back.
intro: |
  Stepping away? Tell everyone with a command, or let the server notice.
icon: CLOCK
category: Chat & community
order: 30
module: essentials
aliases: [away, idle]
keywords: [afk, tablist, nametag, inactive]
commands: [afk]
related: [messaging]
sections:
  - question: How do I mark myself AFK?
    title: Going AFK
    text: |
      Type {run:/afk}. You are marked away at once; type it again, or move, talk, run a command or use an item, and you are back.
  - question: Does the server notice by itself?
    title: Automatic AFK
    when: essentials:afk-enabled
    text: |
      Yes. After {setting:essentials:afk-timeout-seconds|seconds} without moving, chatting, typing a command or using an item, you are marked AFK.
      Coming back is automatic too: as soon as you do anything, you are present again. Even a mob pushing you counts.
  - question: What do others see?
    title: What is shown
    text: |
      A grey <gray>[AFK]</gray> sits in front of your name on the nametag and in the player list.
      {if:essentials:afk-broadcast}Going away and coming back are also announced in chat.{else}Nothing is announced in chat. Only you get a short note.{/if}
      Other features can ask whether you are away, for example an economy that pays passive income only to players who are there.
  - question: Is AFK switched off here?
    title: If it is off
    when: "!essentials:afk-enabled"
    text: |
      Automatic AFK detection is switched off on this server. {cmd:/afk} still works if you want to flag yourself manually.
