id: join-music
title: Music on logging on
summary: The short piece of music you hear when you log on, and how to switch it off.
intro: |
  When you log on, a piece of music plays — just for you, nobody else hears it.
icon: JUKEBOX
category: Chat & community
order: 35
module: essentials
aliases: [joinmusic, loginmusic, music]
keywords: [music, join, login, sound, track]
commands: [joinmusic]
sections:
  - question: Can I switch the music off?
    title: Switching it off
    when: joinmusic:enabled
    text: |
      Yes: {run:/joinmusic off}, or click the line under the music when it starts. It stops at once and stays off, also on the next log-on. {run:/joinmusic on} brings it back.
  - question: Why don't I hear anything?
    title: No music?
    text: |
      The music comes with the server's resource pack — if you did not accept it, there is nothing to play. Check your jukebox volume too (Music & Sounds, "Jukebox/Note Blocks").
  - question: How do staff set it up?
    title: For staff
    text: |
      Put .ogg files (Vorbis) into plugins/RainsEssentials/music and restart; one of them plays at random. Switch it on in /settings under "Music on logging on", where the volume and a credit line are set too.
